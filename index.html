<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELINO Secure Vault Pro</title>

<!-- FontAwesome Icons & jsPDF -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
    --bg: #f4f7fe;
    --card: #ffffff;
    --text: #1b2559;
    --primary: #007bff;
    --primary-hover: #0056b3;
    --secondary: #28a745;
    --danger: #dc3545;
    --border: #e9ecef;
    --sidebar-bg: #ffffff;
    --sidebar-width: 260px;
    --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
}

.dark {
    --bg: #0b1437;
    --card: #111c44;
    --text: #ffffff;
    --primary: #007bff;
    --primary-hover: #38bdf8;
    --secondary: #00d26a;
    --danger: #ef4444;
    --border: #222d5a;
    --sidebar-bg: #111c44;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
}

body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
}

/* Splash & Welcome Overlay Screens (Strict Non-Overlapping Flow) */
#splash-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #0d67c8, #07427c);
    z-index: 999999;
    opacity: 1;
    transition: opacity 0.8s ease;
}

#welcomeScreen {
    position: fixed;
    inset: 0;
    display: none; /* Controlled explicitly via JS */
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #07427c, #0b1437);
    z-index: 999998;
    opacity: 0;
    transition: opacity 0.8s ease;
}

#splash-screen.fade-out, #welcomeScreen.fade-out {
    opacity: 0;
    pointer-events: none;
}

#welcomeScreen.show {
    display: flex;
    opacity: 1;
}

.splash-line {
    width: min(1000px, 90vw);
    height: 2px;
    margin: 18px 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
    animation: lineGlow 2s ease-in-out infinite;
}

@keyframes lineGlow {
    0%, 100% { opacity: .35; transform: scaleX(.9); }
    50% { opacity: 1; transform: scaleX(1); }
}

.apple-logo-text {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(1.8rem, 8vw, 4rem);
    font-weight: 100;
    letter-spacing: clamp(4px, .8vw, 12px);
    color: #fff;
    text-align: center;
}

.apple-logo-text span {
    display: inline-block;
    opacity: 0;
    transform: rotateY(90deg);
    animation: letterRotate .9s ease forwards;
}

.apple-logo-text span:nth-child(1){animation-delay:.1s;}
.apple-logo-text span:nth-child(2){animation-delay:.2s;}
.apple-logo-text span:nth-child(3){animation-delay:.3s;}
.apple-logo-text span:nth-child(4){animation-delay:.4s;}
.apple-logo-text span:nth-child(5){animation-delay:.5s;}
.apple-logo-text span:nth-child(6){animation-delay:.6s;}
.apple-logo-text span:nth-child(7){animation-delay:.7s;}
.apple-logo-text span:nth-child(8){animation-delay:.8s;}
.apple-logo-text span:nth-child(9){animation-delay:.9s;}
.apple-logo-text span:nth-child(10){animation-delay:1s;}
.apple-logo-text span:nth-child(11){animation-delay:1.1s;}
.apple-logo-text span:nth-child(12){animation-delay:1.2s;}
.apple-logo-text span:nth-child(13){animation-delay:1.3s;}
.apple-logo-text span:nth-child(14){animation-delay:1.4s;}
.apple-logo-text span:nth-child(15){animation-delay:1.5s;}
.apple-logo-text span:nth-child(16){animation-delay:1.6s;}

@keyframes letterRotate {
    from { opacity: 0; transform: rotateY(90deg); }
    to { opacity: 1; transform: rotateY(0deg); }
}

.developer-credit {
    margin-top: 18px;
    color: #fff;
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
}

.ms-logo {
    width: 90px;
    height: 90px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
    margin-bottom: 35px;
}

.ms-logo div { width: 42px; height: 42px; }
.red { background: #f25022; }
.green { background: #7fba00; }
.blue { background: #00a4ef; }
.yellow { background: #ffb900; }

#welcomeScreen h1 {
    color: #fff;
    font-weight: 200;
    font-size: clamp(26px, 5vw, 56px);
    letter-spacing: 2px;
}

/* Modals */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(5px);
    z-index: 9999;
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-card {
    background: var(--card);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    box-shadow: var(--shadow);
}

.pin-input, .text-input {
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    text-align: center;
    font-size: 1.1rem;
}

.pin-input {
    font-size: 1.5rem;
    letter-spacing: 8px;
}

/* Application Layout */
.app-wrapper {
    display: flex;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 25px 15px;
    z-index: 1000;
    transition: transform 0.3s ease;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 30px;
    padding-left: 10px;
}

.sidebar-menu {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow-y: auto;
}

.menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s ease;
}

.menu-item-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.menu-item:hover, .menu-item.active {
    background: rgba(0, 123, 255, 0.1);
    color: var(--primary);
}

.badge-lock { font-size: 0.8rem; color: var(--danger); }
.badge-unlock { font-size: 0.8rem; color: var(--secondary); }

.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 25px;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 25px;
}

.mobile-nav-toggle {
    display: none;
    font-size: 1.5rem;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

select, input, button {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input, select {
    background: var(--card);
    color: var(--text);
}

button {
    cursor: pointer;
    color: white;
    font-weight: bold;
    border: none;
    transition: background 0.2s;
}

.action-btn { background: var(--primary); }
.action-btn:hover { background: var(--primary-hover); }
.clear-btn { background: var(--danger); }
.secondary-btn { background: #6c757d; }
.pdf-btn { background: var(--secondary); margin-top: 15px; width: 100%; }

/* Switch Styling */
.theme-switch-container {
    display: flex;
    align-items: center;
    gap: 8px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #cfcfcf;
    transition: .35s;
    border-radius: 50px;
}

.slider:before {
    position: absolute;
    content: "";
    width: 20px;
    height: 20px;
    left: 4px;
    bottom: 4px;
    background: #fff;
    border-radius: 50%;
    transition: .35s;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.switch input:checked + .slider { background: #007bff; }
.switch input:checked + .slider:before { transform: translateX(24px); }

/* Folder Header Bar */
.folder-header {
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
}

.folder-title-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.folder-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Upload Zone */
.upload-zone {
    display: block;
    border: 2px dashed var(--primary);
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    background: rgba(0, 123, 255, 0.03);
    margin-bottom: 20px;
    transition: border-color 0.2s;
}

.upload-zone:hover {
    background: rgba(0, 123, 255, 0.06);
}

.doc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.doc-card {
    background: var(--card);
    padding: 18px;
    border-radius: 16px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
}

.doc-icon {
    font-size: 2.4rem;
    color: var(--primary);
    margin-bottom: 10px;
}

.doc-title {
    font-size: 0.95rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.doc-meta {
    font-size: 0.75rem;
    opacity: 0.7;
    margin-top: 4px;
}

.doc-actions {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
}

.doc-btn {
    width: auto;
    padding: 6px 10px;
    font-size: 0.8rem;
    border-radius: 8px;
}

.footer {
    margin-top: auto;
    padding-top: 20px;
    text-align: center;
    font-size: 13px;
    opacity: .8;
}

.sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 999;
    display: none;
}

@media(max-width:768px){
    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop.active { display: block; }
    .mobile-nav-toggle { display: block; }
    .main-content { padding: 15px; }
}
</style>
</head>
<body>

<!-- 1ST: SPLASH SCREEN -->
<div id="splash-screen">
    <div class="splash-line"></div>
    <div class="apple-logo-text">
        <span>V</span><span>E</span><span>L</span><span>I</span><span>N</span><span>O</span>
        <span>&nbsp;</span>
        <span>E</span><span>C</span><span>O</span><span>S</span><span>Y</span><span>S</span><span>T</span><span>E</span><span>M</span>
    </div>
    <div class="splash-line"></div>
    <div class="developer-credit">Full Stack Developer • AI Enthusiast • Innovator</div>
    <div class="developer-credit">Developed by Shiva Velishoju</div>
</div>

<!-- 2ND: WELCOME SCREEN -->
<div id="welcomeScreen">
    <div class="ms-logo">
        <div class="red"></div>
        <div class="green"></div>
        <div class="blue"></div>
        <div class="yellow"></div>
    </div>
    <h1 id="welcomeTitle">Welcome to Secure Vault</h1>
</div>

<!-- PASSCODE MODAL OVERLAY -->
<div class="modal-overlay" id="folderAuthModal">
    <div class="modal-card">
        <i class="fa-solid fa-folder-lock" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
        <h2 id="modalFolderTitle">Confidential Folder</h2>
        <p style="font-size: 0.85rem; opacity: 0.7; margin-top: 5px;" id="modalInstruction">Enter Folder PIN to Access</p>
        <input type="password" id="folderPinInput" class="pin-input" maxlength="4" placeholder="••••">
        <button class="action-btn" style="width: 100%;" onclick="submitFolderAuth()">Submit</button>
        <button class="clear-btn" style="width: 100%; margin-top: 8px;" onclick="closeModal('folderAuthModal')">Cancel</button>
    </div>
</div>

<!-- RENAME FOLDER MODAL OVERLAY -->
<div class="modal-overlay" id="renameFolderModal">
    <div class="modal-card">
        <i class="fa-solid fa-folder-gear" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
        <h2>Rename Folder</h2>
        <input type="text" id="renameFolderInput" class="text-input" placeholder="New Folder Name">
        <button class="action-btn" style="width: 100%;" onclick="submitRenameFolder()">Save Name</button>
        <button class="clear-btn" style="width: 100%; margin-top: 8px;" onclick="closeModal('renameFolderModal')">Cancel</button>
    </div>
</div>

<!-- RENAME FILE MODAL OVERLAY -->
<div class="modal-overlay" id="renameFileModal">
    <div class="modal-card">
        <i class="fa-solid fa-file-pen" style="font-size: 3rem; color: var(--primary); margin-bottom: 10px;"></i>
        <h2>Rename File</h2>
        <input type="text" id="renameFileInput" class="text-input" placeholder="New File Name">
        <button class="action-btn" style="width: 100%;" onclick="submitRenameFile()">Save File Name</button>
        <button class="clear-btn" style="width: 100%; margin-top: 8px;" onclick="closeModal('renameFileModal')">Cancel</button>
    </div>
</div>

<!-- 3RD: MAIN APP CONTAINER -->
<div class="app-wrapper">
    
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-vault"></i> SecureVault
        </div>
        
        <ul class="sidebar-menu" id="sidebarMenu">
            <!-- Dynamic Sidebar Folders -->
        </ul>
    </aside>

    <!-- WORKSPACE AREA -->
    <main class="main-content">
        <header class="top-bar">
            <button class="mobile-nav-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

            <div class="top-actions">
                <select id="language" onchange="changeLanguage()">
                    <option value="en">English</option>
                    <option value="te">తెలుగు</option>
                </select>

                <div class="theme-switch-container">
                    <label class="switch">
                        <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
                        <span class="slider"></span>
                    </label>
                    <span id="themeIcon">☀️</span>
                </div>
            </div>
        </header>

        <div class="folder-header">
            <div class="folder-title-area">
                <h2 id="currentFolderName">All Documents</h2>
            </div>
            <div class="folder-actions" id="folderActionsArea"></div>
        </div>

        <!-- File Upload Zone -->
        <label for="fileInput" class="upload-zone">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2.2rem; color: var(--primary); margin-bottom: 8px;"></i>
            <p id="uploadText" style="font-weight: 600;">Click or Drag files to Upload</p>
            <span style="font-size: 0.8rem; opacity: 0.7;">Supports PDF, PNG, JPG (Auto-Saved)</span>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
        </label>

        <div class="doc-grid" id="documentGrid"></div>

        <button class="pdf-btn" onclick="downloadPDFReport()" id="pdfBtn">
            📄 Download Vault Inventory Report
        </button>

        <footer class="footer" id="footerText">
            Developed by shiva velishoju
        </footer>
    </main>

</div>

<script>
let activeFolder = 'All';
let renamingFileId = null;

// Folder List Config
let folderList = JSON.parse(localStorage.getItem('velino_folderList')) || [
    { id: 'Education', name: 'Education', icon: 'fa-graduation-cap' },
    { id: 'Identity', name: 'Identity', icon: 'fa-id-card' },
    { id: 'Property', name: 'Property', icon: 'fa-house-chimney' },
    { id: 'Employment', name: 'Employment', icon: 'fa-briefcase' },
    { id: 'Financial', name: 'Financial', icon: 'fa-building-columns' },
    { id: 'Others', name: 'Others', icon: 'fa-folder-open' }
];

// Folder Passcode Configurations
let folderSecurity = JSON.parse(localStorage.getItem('velino_folderSecurity')) || {
    'Education': { isConfidential: false, pin: null, unlocked: false },
    'Identity': { isConfidential: true, pin: '1234', unlocked: false },
    'Property': { isConfidential: false, pin: null, unlocked: false },
    'Employment': { isConfidential: false, pin: null, unlocked: false },
    'Financial': { isConfidential: false, pin: null, unlocked: false },
    'Others': { isConfidential: false, pin: null, unlocked: false }
};

// Documents
let documents = JSON.parse(localStorage.getItem('velino_documents')) || [
    { id: 1, name: "BTech_Degree.pdf", category: "Education", type: "pdf", size: "1.2 MB", date: "2026-02-15", data: null },
    { id: 2, name: "Passport_Copy.jpg", category: "Identity", type: "image", size: "850 KB", date: "2026-03-01", data: null }
];

function saveStateToStorage() {
    localStorage.setItem('velino_documents', JSON.stringify(documents));
    localStorage.setItem('velino_folderSecurity', JSON.stringify(folderSecurity));
    localStorage.setItem('velino_folderList', JSON.stringify(folderList));
}

const translations = {
    en: {
        welcome: "Welcome to Secure Vault",
        upload: "Click or Drag files to Upload",
        all: "All Documents",
        pdf: "📄 Download Vault Inventory Report",
        footer: "Developed by shiva velishoju"
    },
    te: {
        welcome: "సెక్యూర్ వాల్ట్‌కు స్వాగతం",
        upload: "ఫైళ్లను అప్‌లోడ్ చేయడానికి క్లిక్ చేయండి",
        all: "అన్ని రకాల పత్రాలు",
        pdf: "📄 డాక్యుమెంట్ నివేదిక డౌన్‌లోడ్",
        footer: "Developed by shiva velishoju"
    }
};

/* Strictly Sequenced Screen Flow: Splash -> Welcome -> Main */
window.addEventListener("load", function () {
    const splash = document.getElementById("splash-screen");
    const welcome = document.getElementById("welcomeScreen");

    // Render workspace in background
    renderSidebarMenu();
    renderWorkspace();

    // Step 1: Display Splash Screen, then fade out
    setTimeout(function () {
        splash.classList.add("fade-out");

        setTimeout(function () {
            splash.style.display = "none";
            
            // Step 2: Show Welcome Screen
            welcome.classList.add("show");

            setTimeout(function () {
                welcome.classList.add("fade-out");

                setTimeout(function () {
                    welcome.style.display = "none";
                    welcome.classList.remove("show", "fade-out");
                    // Step 3: Main dashboard is now visible without overlap
                }, 800);
            }, 2000);
        }, 800);
    }, 2200);
});

function renderSidebarMenu() {
    const menu = document.getElementById('sidebarMenu');
    menu.innerHTML = '';

    // "All Documents" Item
    const allLi = document.createElement('li');
    allLi.className = `menu-item ${activeFolder === 'All' ? 'active' : ''}`;
    allLi.onclick = () => selectFolder('All');
    allLi.innerHTML = `<div class="menu-item-left"><i class="fa-solid fa-border-all"></i> <span id="menuAll">All Documents</span></div>`;
    menu.appendChild(allLi);

    // Dynamic Custom Folders
    folderList.forEach(folder => {
        const li = document.createElement('li');
        li.className = `menu-item ${activeFolder === folder.id ? 'active' : ''}`;
        li.onclick = () => selectFolder(folder.id);

        const sec = folderSecurity[folder.id] || { isConfidential: false, unlocked: false };
        let lockBadge = '';
        if (sec.isConfidential) {
            lockBadge = sec.unlocked 
                ? `<i class="fa-solid fa-lock-open badge-unlock"></i>` 
                : `<i class="fa-solid fa-lock badge-lock"></i>`;
        }

        li.innerHTML = `
            <div class="menu-item-left"><i class="fa-solid ${folder.icon}"></i> <span>${folder.name}</span></div>
            ${lockBadge}
        `;
        menu.appendChild(li);
    });
}

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarBackdrop").classList.toggle("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarBackdrop").classList.remove("active");
}

function selectFolder(folderId) {
    closeSidebar();
    if (folderId !== 'All' && folderSecurity[folderId]?.isConfidential && !folderSecurity[folderId]?.unlocked) {
        promptFolderAuth(folderId, 'unlock');
        return;
    }
    activeFolder = folderId;
    renderSidebarMenu();
    renderWorkspace();
}

let authContext = { folderId: null, action: null };

function promptFolderAuth(folderId, action) {
    authContext = { folderId: folderId, action: action };
    const folderObj = folderList.find(f => f.id === folderId);
    const folderName = folderObj ? folderObj.name : folderId;

    const modal = document.getElementById('folderAuthModal');
    const title = document.getElementById('modalFolderTitle');
    const instruction = document.getElementById('modalInstruction');
    const pinInput = document.getElementById('folderPinInput');
    
    pinInput.value = '';

    if (action === 'unlock') {
        title.innerText = `Unlock ${folderName}`;
        instruction.innerText = "Enter 4-digit passcode to open folder";
    } else if (action === 'setPin') {
        title.innerText = `Make ${folderName} Private`;
        instruction.innerText = "Set a 4-digit passcode to lock folder";
    }

    modal.style.display = 'flex';
}

function submitFolderAuth() {
    const pin = document.getElementById('folderPinInput').value;
    const { folderId, action } = authContext;

    if (!pin || pin.length !== 4) {
        alert("Please enter a valid 4-digit PIN.");
        return;
    }

    if (!folderSecurity[folderId]) {
        folderSecurity[folderId] = { isConfidential: false, pin: null, unlocked: false };
    }

    if (action === 'unlock') {
        if (pin === folderSecurity[folderId].pin) {
            folderSecurity[folderId].unlocked = true;
            closeModal('folderAuthModal');
            activeFolder = folderId;
            saveStateToStorage();
            renderSidebarMenu();
            renderWorkspace();
        } else {
            alert("Incorrect Folder Passcode!");
            document.getElementById('folderPinInput').value = '';
        }
    } else if (action === 'setPin') {
        folderSecurity[folderId].isConfidential = true;
        folderSecurity[folderId].pin = pin;
        folderSecurity[folderId].unlocked = true;
        closeModal('folderAuthModal');
        saveStateToStorage();
        renderSidebarMenu();
        renderWorkspace();
        alert(`Folder is now Private! Passcode: ${pin}`);
    }
}

function toggleFolderSecurity(folderId) {
    if (folderSecurity[folderId]?.isConfidential) {
        if (confirm(`Make this folder Public (Remove Passcode)?`)) {
            folderSecurity[folderId].isConfidential = false;
            folderSecurity[folderId].pin = null;
            folderSecurity[folderId].unlocked = false;
            saveStateToStorage();
            renderSidebarMenu();
            renderWorkspace();
        }
    } else {
        promptFolderAuth(folderId, 'setPin');
    }
}

/* Folder Renaming */
function openRenameFolderModal() {
    const folderObj = folderList.find(f => f.id === activeFolder);
    if (!folderObj) return;

    document.getElementById('renameFolderInput').value = folderObj.name;
    document.getElementById('renameFolderModal').style.display = 'flex';
}

function submitRenameFolder() {
    const newName = document.getElementById('renameFolderInput').value.trim();
    if (!newName) {
        alert("Folder name cannot be empty.");
        return;
    }

    const folderObj = folderList.find(f => f.id === activeFolder);
    if (folderObj) {
        folderObj.name = newName;
        saveStateToStorage();
        closeModal('renameFolderModal');
        renderSidebarMenu();
        renderWorkspace();
    }
}

/* File Renaming */
function openRenameFileModal(id) {
    const doc = documents.find(d => d.id === id);
    if (!doc) return;

    renamingFileId = id;
    document.getElementById('renameFileInput').value = doc.name;
    document.getElementById('renameFileModal').style.display = 'flex';
}

function submitRenameFile() {
    const newName = document.getElementById('renameFileInput').value.trim();
    if (!newName) {
        alert("File name cannot be empty.");
        return;
    }

    const doc = documents.find(d => d.id === renamingFileId);
    if (doc) {
        doc.name = newName;
        saveStateToStorage();
        closeModal('renameFileModal');
        renderWorkspace();
    }
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

function renderWorkspace() {
    const folderObj = folderList.find(f => f.id === activeFolder);
    const displayTitle = activeFolder === 'All' ? 'All Documents' : (folderObj ? folderObj.name : activeFolder);
    
    document.getElementById('currentFolderName').innerText = displayTitle;
    
    const actionsArea = document.getElementById('folderActionsArea');
    actionsArea.innerHTML = '';

    if (activeFolder !== 'All') {
        // Rename Folder Button
        const renameBtn = document.createElement('button');
        renameBtn.className = 'secondary-btn';
        renameBtn.style.padding = '8px 14px';
        renameBtn.style.fontSize = '0.85rem';
        renameBtn.innerHTML = '<i class="fa-solid fa-pen"></i> Rename Folder';
        renameBtn.onclick = openRenameFolderModal;
        actionsArea.appendChild(renameBtn);

        // Security Lock Toggle Button
        const isConf = folderSecurity[activeFolder]?.isConfidential;
        const lockBtn = document.createElement('button');
        lockBtn.className = isConf ? 'clear-btn' : 'action-btn';
        lockBtn.style.padding = '8px 14px';
        lockBtn.style.fontSize = '0.85rem';
        lockBtn.innerHTML = isConf ? '<i class="fa-solid fa-lock-open"></i> Make Public' : '<i class="fa-solid fa-lock"></i> Make Private';
        lockBtn.onclick = () => toggleFolderSecurity(activeFolder);
        actionsArea.appendChild(lockBtn);
    }

    const grid = document.getElementById('documentGrid');
    grid.innerHTML = '';

    const filtered = activeFolder === 'All' ? documents : documents.filter(d => d.category === activeFolder);

    if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; opacity: 0.6; padding: 30px;">No documents stored in this folder.</p>`;
        return;
    }

    filtered.forEach(doc => {
        const card = document.createElement('div');
        card.className = 'doc-card';
        const iconClass = doc.type === 'pdf' ? 'fa-file-pdf' : 'fa-file-image';

        card.innerHTML = `
            <div class="doc-icon"><i class="fa-solid ${iconClass}"></i></div>
            <div class="doc-title" title="${doc.name}">${doc.name}</div>
            <div class="doc-meta">${displayTitle}</div>
            <div class="doc-meta">${doc.size}</div>
            <div class="doc-actions">
                <button class="action-btn doc-btn" title="View File" onclick="viewDoc(${doc.id})"><i class="fa-solid fa-eye"></i></button>
                <button class="secondary-btn doc-btn" title="Rename File" onclick="openRenameFileModal(${doc.id})"><i class="fa-solid fa-pen"></i></button>
                <button class="clear-btn doc-btn" title="Delete File" onclick="deleteDoc(${doc.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
        `;
        grid.appendChild(card);
    });
}

function handleFileUpload(event) {
    if (activeFolder === 'All') {
        alert("Please select a specific folder from the sidebar before uploading.");
        event.target.value = '';
        return;
    }

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const newDoc = {
            id: Date.now(),
            name: file.name,
            category: activeFolder,
            type: file.type.includes('pdf') ? 'pdf' : 'image',
            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            date: new Date().toISOString().split('T')[0],
            data: e.target.result
        };

        documents.push(newDoc);
        saveStateToStorage();
        renderWorkspace();
        event.target.value = '';
        alert(`File "${file.name}" uploaded successfully!`);
    };

    reader.readAsDataURL(file);
}

function viewDoc(id) {
    const doc = documents.find(d => d.id === id);
    if (!doc) return;

    if (doc.data) {
        const win = window.open();
        if (win) {
            win.document.write(`<iframe src="${doc.data}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
        } else {
            alert("Pop-up blocked! Please allow pop-ups to view document.");
        }
    } else {
        alert(`Simulated preview for default document: ${doc.name}`);
    }
}

function deleteDoc(id) {
    if (confirm("Are you sure you want to delete this document?")) {
        documents = documents.filter(d => d.id !== id);
        saveStateToStorage();
        renderWorkspace();
    }
}

function toggleTheme() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    document.getElementById("themeSwitch").checked = isDark;
    document.getElementById("themeIcon").innerText = isDark ? "☀️" : "🌙";
}

function changeLanguage() {
    const lang = document.getElementById("language").value;
    const t = translations[lang];

    document.getElementById("welcomeTitle").innerText = t.welcome;
    document.getElementById("uploadText").innerText = t.upload;
    document.getElementById("pdfBtn").innerText = t.pdf;
    document.getElementById("footerText").innerText = t.footer;
}

function downloadPDFReport() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const date = new Date().toLocaleString();

    doc.setFillColor(0, 123, 255);
    doc.rect(0, 0, 210, 25, "F");

    doc.setTextColor(255, 255, 255);
    doc.setFontSize(18);
    doc.text("VELINO Secure Vault Inventory", 105, 16, { align: "center" });

    doc.setTextColor(0, 0, 0);
    doc.setFontSize(10);
    doc.text("Generated: " + date, 14, 35);

    doc.setFontSize(12);
    doc.text("Vault Summary:", 14, 45);

    let y = 55;
    documents.forEach((d, index) => {
        const folderObj = folderList.find(f => f.id === d.category);
        const catName = folderObj ? folderObj.name : d.category;
        doc.setFontSize(10);
        doc.text(`${index + 1}. ${d.name} | Folder: ${catName} | Size: ${d.size} | Date: ${d.date}`, 14, y);
        y += 10;
    });

    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text("Developed by Shiva Velishoju", 105, 285, { align: "center" });

    doc.save("Vault_Inventory_Report.pdf");
}

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
